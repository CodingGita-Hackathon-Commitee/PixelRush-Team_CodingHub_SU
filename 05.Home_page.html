<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOD RELAY - Home</title>
    <!-- Font Awesome Icons for design elements -->
    <link rel="stylesheet" href="05.Home_style.css">
    <!-- Google Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>

    <!-- Top Fixed Header -->
    <header class="header">
        <div class="header-left">
            <a href="#" class="back-icon" aria-label="Go Back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <span class="brand-title">BLOOD RELAY</span>
            </div>
        </div>

        <div class="header-right">
            <a href="tel:911" class="dispatch-pill">
                <span class="status-dot"></span>
                <i class="fa-solid fa-phone" style="font-size: 10px;"></i>
                <span>911 Dispatch</span>
            </a>
            <div class="user-avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" 
                     alt="User Profile" 
                     onerror="this.src='https://placehold.co/100x100/e2e8f0/475569?text=User'">
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="container">

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="feature-badge">
                <i class="fa-solid fa-shield-check" style="color: #64748b;"></i>
                FAST • NEARBY • HUMAN
            </div>
            <div class="location-badge">
                <i class="fa-regular fa-compass" style="font-size: 14px;"></i>
                <span>Metro Hub 0.8 km</span>
            </div>
        </div>

        <!-- Hero Section -->
        <section class="hero">
            <div class="relay-tag">
                <span class="green-dot"></span>
                <span>14 Relays Active Now</span>
            </div>
            <div>
                <h1 class="hero-title">Someone needs blood.<br>You can help.</h1>
                <p class="hero-subtitle">Find a verified nearby blood donor in minutes.</p>
            </div>
        </section>

        <!-- Blood Type Selection Section -->
        <section class="blood-section">
            <div class="section-header">
                <span class="section-title">Select Needed Type (Optional)</span>
                <a href="#" class="section-link">All Compatible</a>
            </div>

            <div class="blood-grid">
                <!-- O- -->
                <label class="blood-option">
                    <input type="radio" name="bloodType" checked>
                    <div class="blood-card">
                        <div class="blood-type">O-</div>
                        <div class="blood-label highlight">Universal</div>
                    </div>
                </label>

                <!-- O+ -->
                <label class="blood-option">
                    <input type="radio" name="bloodType">
                    <div class="blood-card">
                        <div class="blood-type">O+</div>
                        <div class="blood-label">High Demand</div>
                    </div>
                </label>

                <!-- A+ -->
                <label class="blood-option">
                    <input type="radio" name="bloodType">
                    <div class="blood-card">
                        <div class="blood-type">A+</div>
                        <div class="blood-label">Common</div>
                    </div>
                </label>

                <!-- B+ -->
                <label class="blood-option">
                    <input type="radio" name="bloodType">
                    <div class="blood-card">
                        <div class="blood-type">B+</div>
                        <div class="blood-label">Ready</div>
                    </div>
                </label>
            </div>
        </section>


</body>
</html>
